name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows ${{ matrix.config }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

      - name: Build the installer
        if: matrix.config == 'Release'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\SmartTrackpad.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Upload the executable and installer
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: SmartTrackpad-windows-${{ github.sha }}
          path: |
            build/Release/SmartTrackpad.exe
            dist/SmartTrackpad-*-setup.exe
          if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libx11-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Portable compiler-only build
        run: sh tools/build-linux.sh build-portable

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: SmartTrackpad-linux-${{ github.sha }}
          path: build/SmartTrackpad
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        # Universal binary: the runner is Apple silicon, Intel Macs must work too.
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
             -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
             -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload the application
        uses: actions/upload-artifact@v4
        with:
          name: SmartTrackpad-macos-${{ github.sha }}
          path: build/SmartTrackpad.app
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          set -eu
          version=$(sed -n 's/^project(SmartTrackpad VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "Packaging $version"
          mkdir -p dist staging

          for platform in windows linux macos; do
            src="artifacts/SmartTrackpad-$platform-${GITHUB_SHA}"
            if [ ! -d "$src" ]; then
              echo "::warning::no $platform artifact, skipping"
              continue
            fi

            dir="staging/SmartTrackpad-$version-$platform"
            rm -rf "$dir"
            mkdir -p "$dir"

            # upload-artifact strips the top directory of the uploaded path, so a
            # macOS bundle arrives as Contents/... and has to be put back inside
            # SmartTrackpad.app for the archive to be a usable app.
            if [ "$platform" = macos ] && [ ! -d "$src/SmartTrackpad.app" ]; then
              bundle="$dir/SmartTrackpad.app"
              mkdir -p "$bundle"
              cp -R "$src"/. "$bundle"/
            else
              cp -R "$src"/. "$dir"/
            fi

            cp README.md LICENSE CHANGELOG.md "$dir"/

            if [ "$platform" = windows ]; then
              # upload-artifact keeps the repository-relative paths when the
              # matched files live in different directories.
              find "$dir" -mindepth 2 -name 'SmartTrackpad.exe' -exec mv {} "$dir"/ \;
              find "$dir" -mindepth 2 -name '*-setup.exe' -exec mv {} "$dir"/ \;
              rm -rf "$dir/build" "$dir/dist"
            fi

            # upload-artifact does not preserve the executable bit.
            if [ "$platform" = linux ]; then
              chmod +x "$dir/SmartTrackpad"
            fi
            if [ "$platform" = macos ]; then
              chmod +x "$dir/SmartTrackpad.app/Contents/MacOS/SmartTrackpad"
            fi

            case "$platform" in
              linux)
                tar -C "$dir" -czf "dist/SmartTrackpad-$version-linux-x86_64.tar.gz" .
                ;;
              *)
                (cd "$dir" && zip -qry "$OLDPWD/dist/SmartTrackpad-$version-$platform.zip" .)
                ;;
            esac
          done

          # Every archive must contain something substantial.
          for archive in dist/*; do
            size=$(stat -c%s "$archive")
            echo "$archive: $size bytes"
            if [ "$size" -lt 20000 ]; then
              echo "::error::$archive looks truncated"
              exit 1
            fi
          done

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SmartTrackpad-*
          overwrite_files: true
          generate_release_notes: false
